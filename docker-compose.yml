services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  app:
    build: .
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8501:8501"
    depends_on:
      - qdrant
    volumes:
      - ./data:/app/data
      - ./.index:/app/.index

volumes:
  qdrant_storage:
